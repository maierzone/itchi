    <text x="15" y="21.5" font-size="2.6">Feld 100 × 100 mm im Maßstab der Hauptkarte · Raster = 1 Kachel = 6,4 mm · streng von oben</text>
    <text x="15" y="28" font-size="2.6">Bogen-Nr. ______   Datum ____________   Stifte ______________________</text>
  </g>
  <g stroke="#221d17" stroke-width="0.3" fill="none">
