<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>ORCHESTRATE &amp; DOMINATE – Skizzenbogen KARTENPROBE (Batch 0)</title>
  <desc>Druckvorlage A4, in 100 % / Tatsächliche Größe drucken. 100 × 100 mm Feld im Maßstab der Hauptkarte K01 (1 Kachel = 6,4 mm). Hellblaue Hilfslinien (#86c5e6) werden beim Scannen entfernt, schwarze Passermarken dienen dem Ausrichten. Siehe docs/03_ART_UND_ASSET_BIBEL.md § 4 und § 10.</desc>
  <rect x="0" y="0" width="210" height="297" fill="#ffffff"/>
