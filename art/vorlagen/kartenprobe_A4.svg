    <circle cx="202" cy="8" r="2.5"/><line x1="198" y1="8" x2="206" y2="8"/><line x1="202" y1="4" x2="202" y2="12"/>
    <circle cx="8" cy="289" r="2.5"/><line x1="4" y1="289" x2="12" y2="289"/><line x1="8" y1="285" x2="8" y2="293"/>
    <circle cx="202" cy="289" r="2.5"/><line x1="198" y1="289" x2="206" y2="289"/><line x1="202" y1="285" x2="202" y2="293"/>
  </g>
