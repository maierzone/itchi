  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" fill="#86c5e6" font-size="2.6">
    <text x="15" y="154" font-weight="700">VORSCHLAG FÜR DEN AUSSCHNITT (GDD § 12.2, um die Südbrücke)</text>
    <text x="15" y="160">Ein Stück DATA LAKE (Fluss, diagonal) mit einer Brücke (x), ein Stück BANDWIDTH ROAD (=),</text>
    <text x="15" y="165">ein Waldrand CACHE FOREST (") und eine Ecke FIREWALL CLIFFS (^). Rest bleibt leeres Papier.</text>
    <text x="15" y="175" font-weight="700">STIFTE (Art-Bibel § 4.1)</text>
    <text x="15" y="181">Linien 0,3–0,5 mm · Schraffur 0,1–0,3 mm · Pinselflächen sparsam (Einheiten liegen darüber)</text>
    <text x="15" y="186">Keine Einheiten, Gebäude oder Datenfelder einzeichnen – das sind eigene Sprites.</text>
    <text x="15" y="196" font-weight="700">TESTDRUCK</text>
    <text x="15" y="202">Diese Linie muss genau 10 mm lang sein:</text>
  </g>
  <line x1="80" y1="201" x2="90" y2="201" stroke="#221d17" stroke-width="0.4"/>
  <line x1="80" y1="199.5" x2="80" y2="202.5" stroke="#221d17" stroke-width="0.3"/>
  <line x1="90" y1="199.5" x2="90" y2="202.5" stroke="#221d17" stroke-width="0.3"/>
